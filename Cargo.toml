[package]
name = "tiktok-live-rust"
authors = ["Tri Nguyen"]
description = "Local TikTok LIVE event engine with a Rust library and a JSON CLI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/thekivashyn/tiktok-live-rust"
version = "0.8.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
flate2 = "1"
futures-util = { version = "0.3", features = ["sink"] }
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "net"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
url = "2"
tokio-util = { version = "0.7", features = ["rt"] }
rand = "0.9"
httpdate = "1"
zeroize = "1"

[dev-dependencies]
crc32fast = "1"
tokio = { version = "1", features = ["test-util", "io-util"] }

[profile.release]
lto = "thin"
strip = true
