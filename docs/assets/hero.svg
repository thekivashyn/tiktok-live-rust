<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title description">
  <title id="title">tiktok-live-rust</title>
  <desc id="description">A Rust library and NDJSON CLI connecting TikTok LIVE events to apps, overlays and agents.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111b2d"/><stop offset="1" stop-color="#090d16"/></linearGradient>
  </defs>
  <rect width="1200" height="330" rx="20" fill="url(#bg)"/>
  <rect x="0" y="0" width="8" height="330" rx="4" fill="#25e0db"/>
  <circle cx="1080" cy="72" r="94" fill="#ff476f" opacity=".08"/>
  <circle cx="1140" cy="252" r="150" fill="#25e0db" opacity=".05"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="54" y="79" fill="#f5f8ff" font-size="46" font-weight="750">tiktok-live-rust</text>
    <text x="56" y="123" fill="#b4c3d9" font-size="25">Rust core. LIVE events. Your app.</text>
    <g fill="#17263a" stroke="#30435d">
      <rect x="56" y="153" width="160" height="37" rx="18"/>
      <rect x="230" y="153" width="168" height="37" rx="18"/>
      <rect x="412" y="153" width="196" height="37" rx="18"/>
    </g>
    <g fill="#e2edfa" font-size="16" text-anchor="middle">
      <text x="136" y="177">Rust library</text><text x="314" y="177">NDJSON CLI</text><text x="510" y="177">Direct guest transport</text>
    </g>
    <path d="M56 223H1144" stroke="#28364c"/>
    <text x="56" y="269" fill="#25e0db" font-size="21" font-weight="600">TikTok LIVE</text>
    <text x="235" y="269" fill="#7085a3" font-size="24">→</text>
    <text x="293" y="269" fill="#f5f8ff" font-size="21">bounded Rust engine</text>
    <text x="557" y="269" fill="#7085a3" font-size="24">→</text>
    <text x="616" y="269" fill="#f5f8ff" font-size="21">apps · overlays · agents</text>
    <text x="1142" y="302" fill="#71829b" font-size="13" text-anchor="end">Built by Tri Nguyen · unofficial TikTok client</text>
  </g>
</svg>
