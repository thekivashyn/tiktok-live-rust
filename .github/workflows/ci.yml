name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # actions/checkout v7, resolved from the upstream tag on 2026-11-10.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux native TLS dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Select stable Rust
        run: rustup update stable --no-self-update
      - name: Select default toolchain
        run: rustup default stable
      - name: Install development components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Offline-behavior test suite
        run: cargo test --all-targets --locked
      - name: Check lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build CLI and examples
        run: cargo build --release --examples --bins --locked
      - name: Check CLI help
        run: cargo run --release --locked -- --help
      - name: Check CLI version
        run: cargo run --release --locked -- --version
